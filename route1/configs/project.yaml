# Route 1 — cross-cohort molecular prognosis in DLBCL
# Phase 0 project configuration. Provisional values are marked; they are fixed
# by the Phase 4 freeze, not here.

study:
  id: route1
  title: >-
    Cross-cohort molecular prognosis in DLBCL with a compact, platform-robust
    representation of biological programs
  working_hypothesis: >-
    A compact representation of DLBCL biological programs can retain
    incremental predictive value beyond clinical risk and established
    expression subtype across independent R-CHOP cohorts, including changes in
    gene-measurement coverage.
  status: working_hypothesis_not_novelty_claim
  supervisor_plan_date: 2026-09-10
  # This study does NOT amend the completed DLBCL-Morph survival analysis.
  amends_prior_study: false
  preserves:
    - reports/preprint/main.tex
    - reports/phase_03c_model_ladder_results.md
    - configs/phase_03b_statistical_analysis_protocol.yaml
  deferred:
    - route2_pathology_coo
    - route3_spatial_transcriptomics

environment:
  development_machine: windows_workspace
  workspace_root: F:/Research Projects/NHL-DLBCL
  # Heavy compute runs on Kaggle by standing project decision.
  compute: kaggle
  gpu: NVIDIA T4
  session_hard_cap_hours: 12
  session_exit_target_hours: 11.5
  monolithic_run_prohibited: true
  # Verified at Phase 0: no commits, no tracked files, no remote.
  version_control: none
  provenance_substitute: route1/manifests/source_registry.csv

paths:
  root: route1
  src: route1/src
  reports: route1/reports
  manifests: route1/manifests
  configs: route1/configs
  kaggle: route1/kaggle
  # Immutable source downloads. Never edited in place.
  raw: route1/data/raw
  metadata: route1/data/metadata
  artifacts: route1/artifacts
  predictions: route1/predictions
  logs: route1/logs

cohorts:
  # Roles are PROVISIONAL and assigned on metadata only (Phase 2 rule).
  # No cohort is certified analysis-ready.
  development:
    accession: GSE181063
    platform: GPL14951          # Illumina Whole-Genome DASL HT v4
    role: provisional_development
    deposited_samples: 1310
    eligible_samples_provisional: 556   # SAMPLES, not patients — Phase 1
    events_provisional: 250
    with_ipi_provisional: 416
    verified: true
    cohort_identity: HMRN population-based (Leeds/York, UK)
    status: patient_identity_unresolved
  candidates:
    - accession: GSE31312
      platform: GPL570
      deposited_samples: 498
      clinical_supplement_cases: 475
      verified: true
      note: International DLBCL Rituximab-CHOP Consortium
    - accession: GSE10846
      platform: GPL570
      deposited_samples: 420
      design_samples: 414       # 181 CHOP + 233 R-CHOP
      unresolved: GSM361239-GSM361244
      verified: true
    - accession: GSE87371
      platform: GPL570
      deposited_samples: 223
      verified: true
      note: LYSA trials; record includes PMBL — apply DLBCL-NOS scope explicitly
    - accession: NCICCR-DLBCL
      platform: RNA-seq
      verified: false
      role: optional_later
  final_test:
    assigned: false
    rule: >-
      At least one independent cohort must remain an untouched final test. A
      cohort that informs model choice becomes a development-validation
      cohort, not the final test.

endpoint:
  name: overall_survival
  development_field: os_followup_y
  status_field: os_status
  time_origin: UNRESOLVED        # blocks survival modelling until settled
  # The prior DLBCL-Morph study used END-OF-TREATMENT origin. It must NOT be
  # merged into this cohort.
  do_not_merge_with: dlbcl_morph_end_of_treatment_os
  resolve_from:
    - PMID:30408148   # Painter et al. 2019, HMRN cell-of-origin
    - PMID:32187361   # Lacy et al. 2020, HMRN targeted sequencing

model_ladder:
  # Provisional per supervisor plan; frozen in Phase 4.
  B0: penalised Cox on clinical components
  B1: B0 + established COO/MHG category
  B2: B1 + fixed biological-program scores, penalised Cox
  B3: small neural survival model on prespecified inputs
  B4: B3 architecture + prespecified gene-coverage masking during training
  primary_methodological_ablation: B4_vs_B3
  notes: >-
    B1 is a cross-cohort primary comparator only if equivalent subtype
    assignments exist or can be generated by a validated, platform-appropriate
    procedure. Do not invent Lymph2Cx centroids or RNA-seq cutoffs.

rules:
  patient_grouped_splits: true
  unique_gsm_is_not_unique_patient: true
  fit_preprocessing_on_training_folds_only: true
  external_outcomes_for_model_selection: false
  no_search_to_rescue_negative_result: true
  log_every_run_and_failed_candidate: true

workspace_conflicts:
  # Recorded, not silently resolved. See route1/reports/decision_log.md.
  count: 3
  register: route1/reports/decision_log.md
